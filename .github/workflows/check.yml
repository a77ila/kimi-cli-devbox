name: kimi-cli-devbox Check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: Verify project files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required boilerplate files exist
        run: |
          test -f src/INSTRUCTIONS.md
          test -f src/AGENTS.md
          test -f CHANGELOG.md
          test -x run-kimi.sh

      # Replace this job with your project's CI (tests, lint, build, etc.)
      # once you have populated src/INSTRUCTIONS.md and added your code.
